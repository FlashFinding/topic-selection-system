<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>课题管理 - 教师工作台</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet"/>

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style-da.css" rel="stylesheet">
</head>

<body>
<div class="container-fluid position-relative bg-white d-flex p-0">
    <!-- Spinner Start -->
    <div id="spinner"
         class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->

    <!-- Sidebar Start -->
    <div class="sidebar pe-4 pb-3">
        <nav class="navbar bg-light navbar-light">
            <a href="/teacher/dashboard" class="navbar-brand mx-4 mb-3">
                <h3 class="text-primary">教师工作台</h3>
            </a>
            <div class="d-flex align-items-center ms-4 mb-4">
                <div class="position-relative">
                    <img class="rounded-circle" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                    <div class="bg-success rounded-circle border border-2 border-white position-absolute end-0 bottom-0 p-1"></div>
                </div>
                <div class="ms-3">
                    <h6 class="mb-0" th:text="${#authentication.principal.username}">用户名</h6>
                    <span>教师</span>
                </div>
            </div>
            <div class="navbar-nav w-100">
                <a href="/teacher/dashboard" class="nav-item nav-link"><i class="fa fa-tachometer-alt me-2"></i>工作台</a>
                <a href="/teacher/project-management" class="nav-item nav-link active"><i class="fa fa-book me-2"></i>课题管理</a>
                <a href="/teacher/process-management" class="nav-item nav-link"><i class="fa fa-tasks me-2"></i>进程管理</a>
                <a href="/teacher/message-management" class="nav-item nav-link"><i class="fa fa-envelope me-2"></i>消息管理</a>
            </div>
        </nav>
    </div>
    <!-- Sidebar End -->

    <!-- Content Start -->
    <div class="content">
        <!-- Navbar Start -->
        <nav class="navbar navbar-expand bg-light navbar-light sticky-top px-4 py-0">
            <a href="#" class="sidebar-toggler flex-shrink-0">
                <i class="fa fa-bars"></i>
            </a>
            
            <div class="navbar-nav align-items-center ms-auto">
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                        <img class="rounded-circle me-lg-2" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                        <span class="d-none d-lg-inline-flex" th:text="${#authentication.principal.username}">用户名</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end bg-light border-0 rounded-0 rounded-bottom m-0">
                        <a href="/user/userinfo" class="dropdown-item">个人信息</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item">退出登录</button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Navbar End -->

        <!-- Main Content Start -->
        <div class="container-fluid pt-4 px-4">
            <div class="row g-4">
                <div class="col-12">
                    <div class="bg-light rounded h-100 p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4>课题管理</h4>
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                                    data-bs-target="#createTopicModal">
                                添加课题
                            </button>
                        </div>

                        <!-- 新建课题模态框 -->
                        <div class="modal fade" id="createTopicModal" tabindex="-1"
                             aria-labelledby="createTopicModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="createTopicModalLabel">新建课题</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form th:action="@{/teacher/saveTopic}" method="post">
                                            <div class="mb-3">
                                                <label for="title" class="form-label">课题名称</label>
                                                <input type="text" class="form-control" id="title" name="title"
                                                       required>
                                            </div>
                                            <div class="mb-3">
                                                <label for="description" class="form-label">描述</label>
                                                <textarea class="form-control" id="description" name="description"
                                                          rows="4" cols="50" style="resize: none;" required></textarea>
                                            </div>
                                            <div class="mb-3">
                                                <label for="requirement" class="form-label">要求</label>
                                                <textarea class="form-control" id="requirement" name="requirement"
                                                          rows="4" cols="50" style="resize: none;" required></textarea>
                                            </div>
                                            <div class="mb-3">
                                                <label for="max_students" class="form-label">名额</label>
                                                <input type="number" class="form-control" id="max_students"
                                                       name="max_students" min="1" required>
                                            </div>
                                            <div>
                                                <button type="submit" class="btn btn-primary">保存</button>
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                                    取消
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                <tr class="text-dark">
                                    <th scope="col">ID</th>
                                    <th scope="col">课题名称</th>
                                    <th scope="col">描述</th>
                                    <th scope="col">要求</th>
                                    <th scope="col">名额</th>
                                    <th scope="col">状态</th>
                                    <th scope="col">操作</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="topic : ${topics}">
                                    <th scope="row" th:text="${topic.id}">id</th>
                                    <td th:text="${topic.title}" style="width: 200px; word-break: break-all;">课题名称
                                    </td>
                                    <td th:text="${topic.description}" style="width: 200px; word-break: break-all;">
                                        课题描述
                                    </td>
                                    <td th:text="${topic.requirements}" style="width: 200px; word-break: break-all;">
                                        要求
                                    </td>
                                    <td th:text="${topic.maxStudents}">名额</td>
                                    <td th:switch="${topic.status}">
                                        <span th:case="0">已驳回</span>
                                        <span th:case="1">审核中</span>
                                        <span th:case="2">进行中</span>
                                        <span th:case="3">已完成</span>
                                    </td>
                                    <td>
                                        <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal"
                                                data-bs-target="#editTopicModal"
                                                th:onclick="'setEditForm(\'' + ${topic.id} + '\')'">编辑
                                        </button>
                                        <button type="button" class="btn btn-sm btn-danger"
                                                th:onclick="'deleteTopic(\'' + ${topic.id} + '\')'">删除
                                        </button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 编辑课题模态框 -->
            <div class="modal fade" id="editTopicModal" tabindex="-1" aria-labelledby="editTopicModalLabel"
                 aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editTopicModalLabel">编辑课题</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form th:action="@{/teacher/updateTopic}" method="post">
                                <input type="hidden" id="editId" name="id">
                                <div class="mb-3">
                                    <label for="editTitle" class="form-label">课题名称</label>
                                    <input type="text" class="form-control" id="editTitle" name="title" required>
                                </div>
                                <div class="mb-3">
                                    <label for="editDescription" class="form-label">描述</label>
                                    <textarea class="form-control" id="editDescription" name="description" rows="4"
                                              cols="50" style="resize: none;" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="editRequirement" class="form-label">要求</label>
                                    <textarea class="form-control" id="editRequirement" name="requirement" rows="4"
                                              cols="50" style="resize: none;" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="editMaxStudents" class="form-label">名额</label>
                                    <input type="number" class="form-control" id="editMaxStudents" name="max_students"
                                           min="1" required>
                                </div>
                                <button type="submit" class="btn btn-primary">保存</button>
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Main Content End -->

            <!-- Footer Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="bg-light rounded-top p-4">
                    <div class="row">
                        <div class="col-12 col-sm-6 text-center text-sm-start">
                            &copy; <a href="#">毕业设计学生选题系统</a>, All Right Reserved.
                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer End -->
        </div>
        <!-- Content End -->

        <!-- Back to Top -->
        <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    </div>
</div>
>
<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/lib/chart/chart.min.js"></script>
<script src="/lib/easing/easing.min.js"></script>
<script src="/lib/waypoints/waypoints.min.js"></script>
<script src="/lib/owlcarousel/owl.carousel.min.js"></script>
<script src="/lib/tempusdominus/js/moment.min.js"></script>
<script src="/lib/tempusdominus/js/moment-timezone.min.js"></script>
<script src="/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

<!-- Template Javascript -->
<script src="/js/main.js"></script>
</body>

</html>

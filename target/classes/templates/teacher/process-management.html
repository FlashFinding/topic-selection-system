<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>进程管理 - 教师工作台</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style-da.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid position-relative bg-white d-flex p-0">
        <!-- Spinner Start -->
        <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <!-- Spinner End -->

        <!-- Sidebar Start -->
        <div class="sidebar pe-4 pb-3">
            <nav class="navbar bg-light navbar-light">
                <a href="/teacher/dashboard" class="navbar-brand mx-4 mb-3">
                    <h3 class="text-primary">工作台</h3>
                </a>
                <div class="d-flex align-items-center ms-4 mb-4">
                    <div class="position-relative">
                        <img class="rounded-circle" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                        <div class="bg-success rounded-circle border border-2 border-white position-absolute end-0 bottom-0 p-1"></div>
                    </div>
                    <div class="ms-3">
                        <h6 class="mb-0" th:text="${#authentication.principal.username}">用户名</h6>
                        <span>教师</span>
                    </div>
                </div>
                <div class="navbar-nav w-100">
                    <a href="/teacher/dashboard" class="nav-item nav-link"><i class="fa fa-tachometer-alt me-2"></i>工作台</a>
                    <a href="/teacher/project-management" class="nav-item nav-link"><i class="fa fa-book me-2"></i>课题管理</a>
                    <a href="/teacher/process-management" class="nav-item nav-link active"><i class="fa fa-tasks me-2"></i>进程管理</a>
                    <a href="/teacher/message-management" class="nav-item nav-link"><i class="fa fa-envelope me-2"></i>消息管理</a>
                </div>
            </nav>
        </div>
        <!-- Sidebar End -->

        <!-- Content Start -->
        <div class="content">
            <!-- Navbar Start -->
            <nav class="navbar navbar-expand bg-light navbar-light sticky-top px-4 py-0">
                <a href="#" class="sidebar-toggler flex-shrink-0">
                    <i class="fa fa-bars"></i>
                </a>
                
                <div class="navbar-nav align-items-center ms-auto">
                    <div class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                            <img class="rounded-circle me-lg-2" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                            <span class="d-none d-lg-inline-flex" th:text="${#authentication.principal.username}">用户名</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end bg-light border-0 rounded-0 rounded-bottom m-0">
                            <a href="/user/userinfo" class="dropdown-item">个人信息</a>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">退出登录</button>
                            </form>
                        </div>
                    </div>
                </div>
            </nav>
            <!-- Navbar End -->

            <!-- JavaScript Libraries -->
            <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
            <!-- Main Content Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                    <div class="col-12">
                        <div class="bg-light rounded h-100 p-4">
                            <h4 class="mb-4">进程管理</h4>
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th scope="col">状态</th>
                                            <th scope="col">课题ID</th>
                                            <th scope="col">课题名称</th>
                                            <th scope="col">选题学生</th>
                                            <th scope="col">描述</th>
                                            <th scope="col">要求</th>
                                            <th scope="col">名额</th>
                                            <th scope="col">选题时间</th>
                                            <th scope="col">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>
                                                <span class="badge bg-success">已选题</span>
                                            </td>
                                            <td>1</td>
                                            <td>课题名称</td>   
                                            <td>学生姓名</td>
                                            <td>课题描述</td>
                                            <td>课题要求</td>
                                            <td>2</td>
                                            <td>2021-09-01</td>
                                            <td>
                                                <button type="button" class="btn btn-sm btn-primary">通过</button>
                                                <button type="button" class="btn btn-sm btn-danger" onclick="rejectTopic(item.st_id)">驳回</button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <script>
                function passTopic(id) {
                    if (confirm('确定要通过该课题申请吗？')) {
                        $.ajax({
                            url: '/teacher/passSTopic',
                            type: 'POST',
                            data: { id: id },
                            dataType: 'json',
                            success: function(response) {
                                if (response && typeof response.success !== 'undefined') {
                                    if (response.success) {
                                        alert(response.message);
                                        location.reload();
                                    } else {
                                        alert('通过失败：' + (response.message || '操作未成功'));
                                    }
                                } else {
                                    console.error('Invalid response format:', response);
                                    alert('通过失败：服务器返回了无效的响应格式');
                                }
                            },
                            error: function(xhr, status, error) {
                                console.error('AJAX Error Details:', {
                                    status: xhr.status,
                                    statusText: xhr.statusText,
                                    responseText: xhr.responseText,
                                    error: error
                                });
                                alert('请求失败：' + error + '\n状态码：' + xhr.status);
                            }
                        });
                    }
                }

                function rejectTopic(id) {
                    if (confirm('确定要驳回该课题吗？')) {
                        $.ajax({
                            url: '/teacher/updateSTopicStatus',
                            type: 'POST',
                            data: { id: id },
                            dataType: 'json',
                            success: function(response) {
                                console.log('Full Response:', response);
                                if (response && typeof response.success !== 'undefined') {
                                    if (response.success) {
                                        alert('驳回成功');
                                        location.reload();
                                    } else {
                                        alert('驳回失败：' + (response.message || '操作未成功'));
                                    }
                                } else {
                                    console.error('Invalid response format:', response);
                                    alert('驳回失败：服务器返回了无效的响应格式');
                                }
                            },
                            error: function(xhr, status, error) {
                                console.error('AJAX Error Details:', {
                                    status: xhr.status,
                                    statusText: xhr.statusText,
                                    responseText: xhr.responseText,
                                    error: error
                                });
                                alert('请求失败：' + error + '\n状态码：' + xhr.status);
                            }
                        });
                    }
                }

                $(document).ready(function() {
                    // 获取已选课题数据
                    $.ajax({
                        url: '/teacher/getSelectedTopics',
                        type: 'GET',
                        success: function(data) {
                            const tbody = $('tbody');
                            tbody.empty(); // 清空现有数据
                            
                            data.forEach(function(item) {
                                const row = `
                                    <tr>
                                        <td>${item.status == 2 ? '审核中' : item.status == 3 ? '已通过' : '已驳回'}</td>
                                        <td>${item.id}</td>
                                        <td>${item.title.length > 6 ? item.title.substring(0, 6) + '...' : item.title}</td>   
                                        <td>${item.realname}</td>
                                        <td>${item.description.length > 6 ? item.description.substring(0, 6) + '...' : item.description}</td>
                                        <td>${item.requirements.length > 6 ? item.requirements.substring(0, 6) + '...' : item.requirements}</td>
                                        <td>${item.max_students}</td>
                                        <td>${new Date(item.create_time).toLocaleDateString()}</td>
                                            <td>
                                                <button type="button" class="btn btn-sm btn-primary" onclick="passTopic(${item.id})">通过</button>
                                                <button type="button" class="btn btn-sm btn-danger" onclick="rejectTopic(${item.id})">驳回</button>
                                            </td>
                                    </tr>
                                `;
                                tbody.append(row);
                            });
                        },
                        error: function(xhr, status, error) {
                            console.error('获取数据失败:', error);
                        }
                    });
                });
            </script>
            <!-- Main Content End -->

            <!-- Footer Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="bg-light rounded-top p-4">
                    <div class="row">
                        <div class="col-12 col-sm-6 text-center text-sm-start">
                            &copy; <a href="#">毕业设计学生选题系统</a>, All Right Reserved. 
                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer End -->
        </div>
        <!-- Content End -->

        <!-- Back to Top -->
        <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/chart/chart.min.js"></script>
    <script src="/lib/easing/easing.min.js"></script>
    <script src="/lib/waypoints/waypoints.min.js"></script>
    <script src="/lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="/lib/tempusdominus/js/moment.min.js"></script>
    <script src="/lib/tempusdominus/js/moment-timezone.min.js"></script>
    <script src="/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

    <!-- Template Javascript -->
    <script src="/js/main.js"></script>
</body>

</html>

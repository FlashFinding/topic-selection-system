    <!-- Icon Font Stylesheet -->

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->

</head>

<body>
    <div class="container-fluid position-relative bg-white d-flex p-0">

            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <!-- Spinner End -->


        <!-- Sidebar Start -->
        <div class="sidebar pe-4 pb-3">
            <nav class="navbar bg-light navbar-light">
                <a href="dashboard.html" class="navbar-brand mx-4 mb-3">
                    <h3 class="text-primary">学生工作台</h3>
                </a>
                <div class="d-flex align-items-center ms-4 mb-4">
                    <div class="position-relative">
                        <img class="rounded-circle" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">

                    </div>

                    </div>
                </div>
                <div class="navbar-nav w-100">

                    <a href="/student/process-management" class="nav-item nav-link"><i class="fa fa-tasks me-2"></i>进程管理</a>
                    <a href="/student/message-management" class="nav-item nav-link active"><i class="fa fa-envelope me-2"></i>消息管理</a>
                </div>
            </nav>
        </div>
        <!-- Sidebar End -->


        <!-- Content Start -->
        <div class="content">
            <!-- Navbar Start -->
            <nav class="navbar navbar-expand bg-light navbar-light sticky-top px-4 py-0">
                <a href="#" class="sidebar-toggler flex-shrink-0">
                    <i class="fa fa-bars"></i>
                </a>
                
                <div class="navbar-nav align-items-center ms-auto">
                    <div class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                            <img class="rounded-circle me-lg-2" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                            <span class="d-none d-lg-inline-flex" th:text="${#authentication.principal.username}">用户名</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end bg-light border-0 rounded-0 rounded-bottom m-0">
                            <a href="/user/userinfo" class="dropdown-item">个人信息</a>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">退出登录</button>
                            </form>
                        </div>
                    </div>
                </div>
            </nav>
            <!-- Navbar End -->
            <!-- Navbar End -->


            <!-- Message List Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="bg-light rounded p-4">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h4 class="mb-0">消息列表</h4>
                    </div>
                    <div class="table-responsive">
                        <table id="message-table" class="table text-start align-middle table-bordered table-hover mb-0">
                            <thead>
                                <tr class="text-dark">
                                    <th scope="col">ID</th>
                                    <th scope="col">状态</th>
                                    <th scope="col">内容</th>
                                    <th scope="col">类型</th>
                                    <th scope="col">发送人</th>
                                    <th scope="col">时间</th>
                                    <th scope="col">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                    <nav class="mt-4">
                        <ul class="pagination justify-content-center">
                            <li class="page-item disabled">
                                <a class="page-link" href="#" tabindex="-1">上一页</a>
                            </li>
                            <li class="page-item active"><a class="page-link" href="#">1</a></li>
                            <li class="page-item"><a class="page-link" href="#">2</a></li>
                            <li class="page-item"><a class="page-link" href="#">3</a></li>
                            <li class="page-item">
                                <a class="page-link" href="#">下一页</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
            <!-- Message List End -->


            <!-- Footer Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="bg-light rounded-top p-4">
                    <div class="row">
                        <div class="col-12 col-sm-6 text-center text-sm-start">

                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer End -->
        </div>
        <!-- Content End -->


        <!-- Back to Top -->
        <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/chart/chart.min.js"></script>
    <script src="/lib/easing/easing.min.js"></script>
    <script src="/lib/waypoints/waypoints.min.js"></script>
    <script src="/lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="/lib/tempusdominus/js/moment.min.js"></script>
    <script src="/lib/tempusdominus/js/moment-timezone.min.js"></script>
    <script src="/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

    <!-- Template Javascript -->
    <script src="/js/main.js"></script>
    <script>
            $(document).ready(function() {
                // 获取所有消息
                function loadAllMessages() {
                    Promise.all([
                        $.ajax({ url: '/messages/null-receiver-role', method: 'GET' }),
                        $.ajax({ url: '/messages/role/2', method: 'GET' }),
                        $.ajax({ url: '/messages/user', method: 'GET' })
                    ]).then(function(responses) {
                        // 合并三个数组
                        const allMessages = responses[0].concat(responses[1], responses[2]);
                        // 按时间排序
                        allMessages.sort((a, b) => new Date(b.createTime) - new Date(a.createTime));
                        renderMessages(allMessages);
                    });
                }

            // 渲染消息列表
            function renderMessages(messages) {
                const $tableBody = $('#message-table').find('tbody');
                $tableBody.empty();

                messages.forEach(message => {
                    const statusBadge = message.status === 0 ? 
                        '<span class="badge bg-warning">未读</span>' : 
                        '<span class="badge bg-success">已读</span>';

                    const row = `
                        <tr>
                            <td>${message.id}</td>
                            <td>${statusBadge}</td>
                            <td>${message.content.slice(0, 20)}</td>
                            <td>${message.type === 0 ? '系统消息' : '通知消息'}</td>
                            <td>${message.senderUsername}</td>
                            <td>${new Date(message.createTime).toLocaleString()}</td>
                            <td>
                                <button class="btn btn-sm btn-primary">查看</button>
                                <button class="btn btn-sm btn-danger">删除</button>
                            </td>
                        </tr>
                    `;
                    $tableBody.append(row);
                });
            }

            // 初始化加载数据
            loadAllMessages();

            // 绑定查看按钮点击事件
            $(document).on('click', '.btn-primary', function() {
                const $tr = $(this).closest('tr');
                const messageId = $tr.find('td').eq(0).text();
                
                // 先更新状态为已读
                $.ajax({
                    url: '/messages/' + messageId + '/status',
                    method: 'PATCH',
                    data: { status: 1 },
                    success: function() {
                        // 更新成功后获取消息详情
                        $.ajax({
                            url: '/messages/' + messageId,
                            method: 'GET',
                            success: function(message) {
                                // 更新前端状态显示
                                $tr.find('td').eq(1).html('<span class="badge bg-success">已读</span>');
                                $('#messageContent').text(message.content);
                                $('#messageSender').text(message.senderUsername);
                                $('#messageTime').text(new Date(message.createTime).toLocaleString());
                                $('#messageModal').modal('show');
                            },
                            error: function() {
                                alert('获取消息详情失败');
                            }
                        });
                    },
                    error: function() {
                        alert('更新状态失败');
                    }
                });
            });

            // 绑定删除按钮点击事件
            $(document).on('click', '.btn-danger', function() {
                const $tr = $(this).closest('tr');
                const messageId = $tr.find('td').eq(0).text();
                
                if (confirm('确定要删除这条消息吗？')) {
                    $.ajax({
                        url: '/messages/' + messageId,
                        method: 'DELETE',
                        success: function() {
                            $tr.remove();
                            alert('删除成功');
                        },
                        error: function() {
                            alert('删除失败');
                        }
                    });
                }
            });
        });

        // 模态框结构
        const modalHtml = `
            <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="messageModalLabel">消息详情</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">消息内容</label>
                                <p id="messageContent"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">发送人</label>
                                <p id="messageSender"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">发送时间</label>
                                <p id="messageTime"></p>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        $('body').append(modalHtml);
    </script>
</body>

</html>

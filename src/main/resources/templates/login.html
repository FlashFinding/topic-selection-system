<!DOCTYPE html>
<html lang="zxx">

<head>
    <title>毕业设计学生选题系统*登录</title>
    <!-- Meta tag Keywords -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8"/>
    <meta name="keywords"
          content="Report Login Form Responsive web template, Bootstrap Web Templates, Flat Web Templates, Android Compatible web template, Smartphone Compatible web template, free webdesigns for Nokia, Samsung, LG, SonyEricsson, Motorola web design"/>
    <!-- //Meta tag Keywords -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
          rel="stylesheet">
    <!--/Style-CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" type="text/css" media="all" />

    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}" type="text/css" media="all">

</head>

<body>

<!-- form section start -->
<section class="w3l-hotair-form">
    <h1>毕业设计学生选题系统</h1>
    <div class="container">
        <!-- /form -->
        <div class="workinghny-form-grid">
            <div class="main-hotair">
                <div class="content-wthree">
                    <h2>登录</h2>
                    <form id="loginForm" action="/perform_login" method="post">
                        <label>
                            <input type="text" class="text" id="username" placeholder="账号" required="">
                            <input type="password" class="password" name="password" placeholder="密码" required=""
                                   autofocus>
                        </label>
                        <div class="role-select">
                            <div class="select-wrapper">
                                <label>
                                    <select id="role" required>
                                        <option value="">选择角色</option>
                                        <option value="STUDENT">学生</option>
                                        <option value="TEACHER">教师</option>
                                        <option value="ADMIN">管理员</option>
                                    </select>
                                </label>
                            </div>
                        </div>
                        <input type="hidden" name="username" id="combinedUsername">
                        <button class="btn" type="submit">登录</button>
                    </form>
                    <script>
                        document.getElementById('loginForm').addEventListener('submit', function(event) {
                            const username = document.getElementById('username').value;
                            const role = document.getElementById('role').value;
                            document.getElementById('combinedUsername').value = `${username}:${role}`;
                        });
                    </script>

                    <p class="account">没有账户? <a th:href="@{/register}">注册</a></p>

                    <script>
                        document.addEventListener('DOMContentLoaded', function() {
                            const errorModal = document.getElementById('errorModal');
                            const confirmButton = document.getElementById('confirmButton');
                            const invalidCredentials = document.getElementById('invalidCredentials');

                            if (invalidCredentials) {
                                errorModal.style.display = 'block';
                            }

                            confirmButton.addEventListener('click', function() {
                                window.location.href = '/login';
                            });

                            // Close modal when clicking outside
                            window.addEventListener('click', function(event) {
                                if (event.target === errorModal) {
                                    errorModal.style.display = 'none';
                                    window.location.href = '/login';
                                }
                            });
                        });
                    </script>
                </div>
                <div class="w3l_form align-self">
                    <div class="left_grid_info">
                        <img th:src="@{/images/index.png}" alt="" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
        <!-- //form -->
    </div>
    <!-- copyright-->
    <div class="copyright text-center">
        <p class="copy-footer-29">© 2025 毕业设计学生选题系统</p>
    </div>
    <!-- //copyright-->
</section>
<!-- //form section start -->
<!-- //form section start -->
</body>

</html>

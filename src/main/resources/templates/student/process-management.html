<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>进程管理 - 学生工作台</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style-da.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid position-relative bg-white d-flex p-0">
        <!-- Spinner Start -->
        <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <!-- Spinner End -->

        <!-- Sidebar Start -->
        <div class="sidebar pe-4 pb-3">
            <nav class="navbar bg-light navbar-light">
                <a href="dashboard.html" class="navbar-brand mx-4 mb-3">
                    <h3 class="text-primary">学生工作台</h3>
                </a>
                <div class="d-flex align-items-center ms-4 mb-4">
                    <div class="position-relative">
                        <img class="rounded-circle" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                        <div class="bg-success rounded-circle border border-2 border-white position-absolute end-0 bottom-0 p-1"></div>
                    </div>
                    <div class="ms-3">
                        <h6 class="mb-0" th:text="${#authentication.principal.username}">用户名</h6>
                        <span>学生</span>
                    </div>
                </div>
                <div class="navbar-nav w-100">
                    <a href="/student/dashboard" class="nav-item nav-link"><i class="fa fa-tachometer-alt me-2"></i>工作台</a>
                    <a href="/student/project-management" class="nav-item nav-link"><i class="fa fa-book me-2"></i>课题管理</a>
                    <a href="/student/process-management" class="nav-item nav-link active"><i class="fa fa-tasks me-2"></i>进程管理</a>
                    <a href="/student/message-management" class="nav-item nav-link"><i class="fa fa-envelope me-2"></i>消息管理</a>
                </div>
            </nav>
        </div>
        <!-- Sidebar End -->

        <!-- Content Start -->
        <div class="content">
            <!-- Navbar Start -->
            <nav class="navbar navbar-expand bg-light navbar-light sticky-top px-4 py-0">
                <a href="#" class="sidebar-toggler flex-shrink-0">
                    <i class="fa fa-bars"></i>
                </a>
                
                <div class="navbar-nav align-items-center ms-auto">
                    <div class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                            <img class="rounded-circle me-lg-2" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                            <span class="d-none d-lg-inline-flex" th:text="${#authentication.principal.username}">用户名</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end bg-light border-0 rounded-0 rounded-bottom m-0">
                            <a href="/user/userinfo" class="dropdown-item">个人信息</a>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">退出登录</button>
                            </form>
                        </div>
                    </div>
                </div>
            </nav>
            <!-- Navbar End -->
            <!-- Navbar End -->


            <!-- Task List Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="bg-light rounded p-4">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h4 class="mb-0">选题进程</h4>
                    </div>
                    <div class="table-responsive">
                        <table class="table text-start align-middle table-bordered table-hover mb-0">
                            <thead>
                                <tr class="text-dark">
                                    <th scope="col">状态</th>
                                    <th scope="col">课题ID</th>  
                                    <th scope="col">课题名称</th>
                                    <th scope="col">描述</th>
                                    <th scope="col">名额</th>
                                    <th scope="col">要求</th>
                                    <th scope="col">指导老师</th>
                                    <th scope="col">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="selection : ${selections}">
                                    <td>
                                        <span th:if="${selection.status == 3}" class="badge bg-success">已通过</span>
                                        <span th:if="${selection.status == 2}" class="badge bg-warning">审核中</span>
                                        <span th:if="${selection.status == 0}" class="badge bg-danger">已驳回</span>
                                    </td>
                                    <td th:text="${selection.id}"></td>
                                    <td th:text="${#strings.length(selection.title) >= 5}? ${#strings.substring(selection.title, 0, 5)} : ${selection.title}"></td>
                                    <td th:text="${#strings.length(selection.description) >= 5}? ${#strings.substring(selection.description, 0, 5)}: ${selection.description}"></td>
                                    <td th:text="${selection.max_students}"></td>
                                    <td th:text="${#strings.length(selection.requirements) >= 5}? ${#strings.substring(selection.requirements, 0, 5)}: ${selection.requirements}"></td>
                                    <td th:text="${selection.realname}"></td>
                                    <td>
                                        <button class="btn btn-sm btn-primary">查看详情</button>
                                        <button class="btn btn-sm btn-warning">取消选题</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- Task List End -->

            <!-- Footer Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="bg-light rounded-top p-4">
                    <div class="row">
                        <div class="col-12 col-sm-6 text-center text-sm-start">
                            &copy; <a href="#"> 毕业设计学生选题系统</a>, 版权所有
                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer End -->
        </div>
        <!-- Content End -->

        <!-- Back to Top -->
        <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/chart/chart.min.js"></script>
    <script src="/lib/easing/easing.min.js"></script>
    <script src="/lib/waypoints/waypoints.min.js"></script>
    <script src="/lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="/lib/tempusdominus/js/moment.min.js"></script>
    <script src="/lib/tempusdominus/js/moment-timezone.min.js"></script>
    <script src="/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

    <!-- Template Javascript -->
    <script src="/js/main.js"></script>

    <!-- Topic Detail Modal -->
    <div class="modal fade" id="topicDetailModal" tabindex="-1" aria-labelledby="topicDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="topicDetailModalLabel">课题详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>课题ID：</strong><span id="modalTopicId"></span></p>
                            <p><strong>课题名称：</strong><span id="modalTopicTitle"></span></p>
                            <p><strong>描述：</strong><span id="modalTopicDescription"></span></p>
                            <p><strong>邮箱：</strong><span id="modalEmail"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>名额：</strong><span id="modalTopicMaxStudents"></span></p>
                            <p><strong>要求：</strong><span id="modalTopicRequirements"></span></p>
                            <p><strong>指导老师：</strong><span id="modalTopicTeacher"></span></p>
                            <p><strong>电话：</strong><span id="modalPhone"></span></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('.btn-primary').click(function() {
                // 获取当前行的课题ID
                var topicId = $(this).closest('tr').find('td:eq(0)').text();
                
                // 调用API获取课题详细信息
                $.ajax({
                    url: '/student/get-topic-info-by-student-id',
                    method: 'GET',
                    success: function(data) {
                        if (data && data.length > 0) {
                            var topicInfo = data[0];
                            $('#modalTopicId').text(topicInfo.id);
                            $('#modalTopicTitle').text(topicInfo.title);
                            $('#modalTopicDescription').text(topicInfo.description);
                            $('#modalTopicMaxStudents').text(topicInfo.max_students);
                            $('#modalTopicRequirements').text(topicInfo.requirements);
                            $('#modalTopicTeacher').text(topicInfo.realname);
                            $('#modalPhone').text(topicInfo.phone);
                            $('#modalEmail').text(topicInfo.email);
                            $('#topicDetailModal').modal('show');
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('获取课题信息失败:', error);
                        alert('获取课题信息失败，请稍后重试');
                    }
                });
            });

            // 取消选题按钮点击事件
            $('.btn-warning').click(function() {
                if(confirm('确定要取消选题吗？')) {
                    var selectionId = $(this).closest('tr').find('td:eq(0)').text();
                    $.ajax({
                        url: '/student/cancel-topic',
                        method: 'POST',
                        success: function() {
                            alert('选题已取消');
                            location.reload();
                        },
                        error: function(xhr, status, error) {
                            console.error('取消选题失败:', error);
                            alert('取消选题失败，请稍后重试');
                        }
                    });
                }
            });
        });
    </script>
</body>

</html>

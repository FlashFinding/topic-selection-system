<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>角色管理 - 管理员工作台</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style-da.css" rel="stylesheet">
</head>

<body>
<div class="container-fluid position-relative bg-white d-flex p-0">
    <!-- Spinner Start -->
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->

    <!-- Sidebar Start -->
    <div class="sidebar pe-4 pb-3">
        <nav class="navbar bg-light navbar-light">
            <a href="/admin/dashboard" class="navbar-brand mx-4 mb-3">
                <h3 class="text-primary">管理员工作台</h3>
            </a>
            <div class="d-flex align-items-center ms-4 mb-4">
                <div class="position-relative">
                    <img class="rounded-circle" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                    <div class="bg-success rounded-circle border border-2 border-white position-absolute end-0 bottom-0 p-1"></div>
                </div>
                <div class="ms-3">
                    <h6 class="mb-0" th:text="${#authentication.principal.username}">用户名</h6>
                    <span>管理员</span><!--此处显示账号类型-->
                </div>
            </div>
            <div class="navbar-nav w-100">
                <a href="/admin/dashboard" class="nav-item nav-link"><i class="fa fa-tachometer-alt me-2"></i>工作台</a>
                <a href="/admin/user-management" class="nav-item nav-link"><i class="fa fa-th me-2"></i>用户管理</a>
                <a href="/admin/role-management" class="nav-item nav-link active"><i class="fa fa-keyboard me-2"></i>角色管理</a>
                <a href="/admin/project-management" class="nav-item nav-link"><i class="fa fa-book me-2"></i>课题管理</a>
                <a href="/admin/message-management" class="nav-item nav-link"><i class="fa fa-envelope me-2"></i>消息管理</a>
            </div>
        </nav>
    </div>
    <!-- Sidebar End -->


    <!-- Content Start -->
    <div class="content">
        <!-- Navbar Start -->
        <nav class="navbar navbar-expand bg-light navbar-light sticky-top px-4 py-0">
            <a href="#" class="sidebar-toggler flex-shrink-0">
                <i class="fa fa-bars"></i>
            </a>
            
            <div class="navbar-nav align-items-center ms-auto">
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                        <img class="rounded-circle me-lg-2" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                        <span class="d-none d-lg-inline-flex" th:text="${#authentication.principal.username}">用户名</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end bg-light border-0 rounded-0 rounded-bottom m-0">
                        <a href="/user/userinfo" class="dropdown-item">个人信息</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item">退出登录</button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Navbar End -->
        <!-- Navbar End -->


        <!-- 角色管理主要内容 -->
        <div class="container-fluid pt-4 px-4">
            <div class="bg-light text-center rounded p-4">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h4 class="mb-0">角色管理</h4>
                </div>

                <!-- 角色列表 -->
                <div class="table-responsive">
                    <table class="table text-start align-middle table-bordered table-hover mb-0">
                        <thead>
                            <tr class="text-dark">
                                <th scope="col">
                                    <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)">
                                </th>
                                <th scope="col">ID</th>
                                <th scope="col">角色名称</th>
                                <th scope="col">描述</th>
                                <th scope="col">权限数量</th>
                                <th scope="col">人数</th>
                                <th scope="col">操作</th>
                            </tr>
                        </thead>
                        <tbody id="roleTableBody">
                            <!-- 角色数据将通过JavaScript动态插入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 编辑角色模态框 -->
        <div class="modal fade" id="editRoleModal" tabindex="-1" aria-labelledby="editRoleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editRoleModalLabel">编辑角色</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="mb-3">
                                <label for="editRoleName" class="form-label">角色名称</label>
                                <input type="text" class="form-control" id="editRoleName" required>
                            </div>
                            <div class="mb-3">
                                <label for="editRoleDescription" class="form-label">角色描述</label>
                                <textarea class="form-control" id="editRoleDescription" rows="3" style="width: 100%; height: 120px; resize: none;"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Start -->
        <div class="container-fluid pt-4 px-4">
            <div class="bg-light rounded-top p-4">
                <div class="row">
                    <div class="col-12 col-sm-6 text-center text-sm-start">
                        &copy; <a href="#">毕业设计学生选题系统</a>, All Right Reserved.
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer End -->
    </div>
    <!-- Content End -->


    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
</div>

<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/lib/chart/chart.min.js"></script>
<script src="/lib/easing/easing.min.js"></script>
<script src="/lib/waypoints/waypoints.min.js"></script>
<script src="/lib/owlcarousel/owl.carousel.min.js"></script>
<script src="/lib/tempusdominus/js/moment.min.js"></script>
<script src="/lib/tempusdominus/js/moment-timezone.min.js"></script>
<script src="/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

<!-- Template Javascript -->
<script src="/js/main.js"></script>
<script>
    // 页面加载时获取角色数据
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/admin/api/roles')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('roleTableBody');
                tbody.innerHTML = ''; // 清空现有内容
                
                data.forEach(role => {
                    const row = `
                        <tr>
                            <td>
                                <label>
                                    <input type="checkbox" name="roleCheckbox" value="${role.id}">
                                </label>
                            </td>
                            <td>${role.id}</td>
                            <td>${role.name}</td>
                            <td>${role.description}</td>
                            <td>${role.statusOneCount}</td>
                            <td>${role.userCount}</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="openEditModal('${role.id}')">编辑</button>
                                <button class="btn btn-sm btn-danger" onclick="toggleRoleStatus(this)">禁用</button>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            })
            .catch(error => console.error('Error fetching roles:', error));
    });

    // 打开编辑模态框并填充数据
    function openEditModal(roleId) {
        fetch(`/admin/api/roles/${roleId}`)
            .then(response => response.json())
            .then(role => {
                document.getElementById('editRoleName').value = role.name;
                document.getElementById('editRoleDescription').value = role.description;
                document.querySelector('#editRoleModal .btn-primary').onclick = () => saveRole(roleId);
                new bootstrap.Modal(document.getElementById('editRoleModal')).show();
            })
            .catch(error => console.error('Error fetching role:', error));
    }

    // 保存角色修改
    function saveRole(roleId) {
        const roleData = {
            name: document.getElementById('editRoleName').value,
            description: document.getElementById('editRoleDescription').value
        };

        fetch(`/admin/api/roles/${roleId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(roleData)
        })
        .then(response => {
            if (response.ok) {
                location.reload(); // 刷新页面
            } else {
                alert('保存失败');
            }
        })
        .catch(error => console.error('Error saving role:', error));
    }

    // 禁用角色
    function disableRole(roleName) {
        fetch('/admin/api/roles/disable', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ roleName: roleName })
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('操作失败');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    // 启用角色
    function enableRole(roleName) {
        fetch('/admin/api/roles/enable', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ roleName: roleName })
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('操作失败');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    // 角色状态切换
    function toggleRoleStatus(btn) {
        const row = btn.closest('tr');
        const roleName = row.querySelector('td:nth-child(3)').textContent;
        const isActive = !row.classList.contains('table-secondary');
        
        const confirmMessage = isActive ? '确定要禁用该角色吗？' : '确定要启用该角色吗？';
        
        if (confirm(confirmMessage)) {
            const action = isActive ? disableRole : enableRole;
            action(roleName)
                .then(() => {
                    btn.textContent = isActive ? '启用' : '禁用';
                    btn.className = `btn btn-sm ${isActive ? 'btn-success' : 'btn-danger'}`;
                    row.classList.toggle('table-secondary');
                })
                .catch(error => {
                    console.error('操作失败:', error);
                    alert('操作失败，请重试');
                });
        }
    }

    // 修改disableRole和enableRole函数返回Promise
    function disableRole(roleName) {
        return fetch('/admin/api/roles/disable', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ roleName: roleName })
        }).then(response => {
            if (!response.ok) {
                throw new Error('禁用操作失败');
            }
        });
    }

    function enableRole(roleName) {
        return fetch('/admin/api/roles/enable', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ roleName: roleName })
        }).then(response => {
            if (!response.ok) {
                throw new Error('启用操作失败');
            }
        });
    }

    // 全选/取消全选
    function toggleSelectAll(selectAllCheckbox) {
        const checkboxes = document.querySelectorAll('input[name="roleCheckbox"]');
        checkboxes.forEach(checkbox => {
            checkbox.checked = selectAllCheckbox.checked;
        });
    }
</script>
</body>

</html>

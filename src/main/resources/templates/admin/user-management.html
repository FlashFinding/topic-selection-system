<!-- Template Javascript -->
<script src="/js/main.js"></script>
<script>
    // 用户管理页面获取用户数据并填充表格
    function loadUserData() {
        const username = document.querySelector('.form-control').value;
        const role = document.getElementById('roleFilter').value;
        const status = document.getElementById('statusFilter').value;

        let url = '/user/api/showUsers?';
        if (username) {
            url += `username=${encodeURIComponent(username)}&`;
        }
        if (role) {
            url += `role=${encodeURIComponent(role)}&`;
        }
        if (status) {
            url += `status=${encodeURIComponent(status)}&`;
        }

        fetch(url)
            .then(response => response.json())
            .then(users => {
                const tbody = document.querySelector('table tbody');
                tbody.innerHTML = ''; // 清空现有数据
                
                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.realName || '未设置'}</td>
                        <td>${user.role}</td>
                <td><span class="badge ${user.status == 1 ? 'bg-success' : 'bg-secondary'}">${user.status == 1 ? '启用' : '禁用'}</span></td>
                        <td>${user.createTime ? user.createTime.substring(0, 10) : '无'}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#editUserModal">编辑</button>
                            <button class="btn btn-sm btn-info" data-bs-toggle="modal" data-bs-target="#viewUserModal">详情</button>
                            <button class="btn btn-sm btn-warning" onclick="toggleUserStatus(this)">${user.status == 0 ? '启用' : '禁用'}</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser(this)">删除</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(error => console.error('获取用户数据失败:', error));
    }

    // 页面加载时获取用户数据
    document.addEventListener('DOMContentLoaded', loadUserData);

    // 为搜索按钮添加点击事件
    document.getElementById('searchBtn').addEventListener('click', loadUserData);

    // 为输入框和下拉框添加回车键事件
    document.querySelectorAll('.form-control, .form-select').forEach(element => {
        element.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadUserData();
            }
        });
    });

    // 编辑用户事件处理
    const editUserModal = document.getElementById('editUserModal');
    
    editUserModal.addEventListener('show.bs.modal', function (event) {
      const button = event.relatedTarget;
      const row = button.closest('tr');
      const id = row.querySelector('td').textContent;
      
      // 编辑表单获取用户数据
      fetch(`/admin/api/users/${id}`)
        .then(response => response.json())
        .then(user => {
          // 填充表单
              document.getElementById('editUsername').value = user.username;
              document.getElementById('editRealName').value = user.realName || '';
              document.getElementById('editPassword').value = ''; // 清空密码字段
              document.getElementById('editPassword').type = 'password'; // 确保输入框类型为密码
              document.getElementById('editPassword').placeholder = '留空则不修改密码'; // 添加占位符提示
          
          // 设置角色下拉菜单选中项
          const roleSelect = document.getElementById('editRole');
          for (let i = 0; i < roleSelect.options.length; i++) {
            if (roleSelect.options[i].value == user.role) {
              roleSelect.selectedIndex = i;
              break;
            }
          }
          
          // 设置状态下拉菜单选中项
          const statusSelect = document.getElementById('editStatus');
          for (let i = 0; i < statusSelect.options.length; i++) {
            if (statusSelect.options[i].value == user.status) {
              statusSelect.selectedIndex = i;
              break;
            }
          }
          
          // 保存按钮点击事件
          const saveBtn = editUserModal.querySelector('.btn-primary');
          saveBtn.onclick = () => {
            const password = document.getElementById('editPassword').value;
            const updatedUser = {
              username: document.getElementById('editUsername').value,
              realName: document.getElementById('editRealName').value,
              password: password ? password : undefined, // 仅当输入新密码时更新
              role: document.getElementById('editRole').value,
              status: document.getElementById('editStatus').value
            };
            
            fetch(`/admin/api/users/${id}`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(updatedUser)
            })
            .then(response => {
              if (!response.ok) {
                throw new Error('更新失败，请稍后重试');
              }
              return response.json();
            })
            .then(() => {
              // 关闭模态框并刷新数据
              bootstrap.Modal.getInstance(editUserModal).hide();
              loadUserData();
            })
            .catch(error => {
              alert(error.message);
            });
          };
        });
    });

    // 查看用户详情事件处理
    const viewUserModal = document.getElementById('viewUserModal');
    
    viewUserModal.addEventListener('show.bs.modal', function (event) {
      const button = event.relatedTarget;
      const row = button.closest('tr');
      const id = row.querySelector('td').textContent;
      
      // 获取用户详情并填充表单
      fetch(`/admin/api/users/${id}`)
        .then(response => response.json())
        .then(user => {
          document.getElementById('viewUsername').textContent = user.username;
          document.getElementById('viewName').textContent = user.realName || '未设置';
          document.getElementById('viewRole').textContent = user.role;
          document.getElementById('viewStatus').textContent = user.status == 1 ? '启用' : '禁用';
          document.getElementById('viewEmail').textContent = user.email || '未设置';
          document.getElementById('viewPhone').textContent = user.phone || '未设置';
          document.getElementById('viewCreateTime').textContent = user.createTime ? user.createTime.substring(0, 10) : '无';
          document.getElementById('viewUpdateTime').textContent = user.updateTime ? user.updateTime.substring(0, 10) : '无';
        });
    });

    // 用户状态切换
    function toggleUserStatus(btn) {
        const row = btn.closest('tr');
        const userId = row.querySelector('td').textContent;
        const statusBadge = row.querySelector('.badge');
        const isActive = statusBadge.textContent === '启用';
        const newStatus = isActive ? 0 : 1;

        fetch(`/admin/api/users/${userId}/status`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                status: newStatus
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('状态更新失败');
            }
            return response.json();
        })
        .then(() => {
            // 更新按钮文本和样式
            btn.textContent = isActive ? '启用' : '禁用';
            btn.className = isActive ? 'btn btn-sm btn-success' : 'btn btn-sm btn-warning';
            // 更新状态徽章
            statusBadge.textContent = isActive ? '禁用' : '启用';
            statusBadge.className = isActive ? 'badge bg-secondary' : 'badge bg-success';
            // 刷新用户数据
            loadUserData();
        })
        .catch(error => {
            alert(error.message);
        });
    }

    // 删除用户
    function deleteUser(btn) {
        if (confirm('确定要删除该用户吗？')) {
            const row = btn.closest('tr');
            const userId = row.querySelector('td').textContent;
            
            fetch(`/admin/api/users/${userId}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('删除失败，请稍后重试');
                }
                return response.json();
            })
            .then(() => {
                row.remove();
            })
            .catch(error => {
                alert(error.message);
            });
        }
    }

    // 批量操作
    function batchUserOperation(action) {
        const selectedRows = document.querySelectorAll('input[type="checkbox"]:checked');
        if (selectedRows.length === 0) {
            alert('请先选择要操作的用户');
            return;
        }

        if (confirm(`确定要对选中的${selectedRows.length}个用户执行${action}操作吗？`)) {
            selectedRows.forEach(checkbox => {
                const row = checkbox.closest('tr');
                if (action === 'delete') {
                    row.remove();
                } else if (action === 'disable') {
                    const statusBtn = row.querySelector('.btn-warning');
                    if (statusBtn) toggleUserStatus(statusBtn);
                }
            });
        }
    }

    // 添加用户事件处理
    const addUserModal = document.getElementById('addUserModal');
    addUserModal.addEventListener('show.bs.modal', function () {
        // 清空表单
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('role').selectedIndex = 0;
    });

    // 保存按钮点击事件
    document.querySelector('#addUserModal .btn-primary').onclick = function() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;

        // 基本验证
        if (!username || !password || !role) {
            alert('请填写所有必填项');
            return;
        }

        // 提交数据
        fetch('/admin/api/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: username,
                password: password,
                role: role
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('用户名重复 ，添加用户失败 !');
            }
            return response.json();
        })
        .then(() => {
            // 关闭模态框并刷新数据
            bootstrap.Modal.getInstance(addUserModal).hide();
            loadUserData();
        })
        .catch(error => {
            alert(error.message);
        });
    };
</script>
</body>

</html>

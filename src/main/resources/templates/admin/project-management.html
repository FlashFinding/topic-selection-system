<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>课题管理 - 管理员工作台</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet"/>

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style-da.css" rel="stylesheet">
</head>

<body>
<div class="container-fluid position-relative bg-white d-flex p-0">
    <!-- Spinner Start -->
    <div id="spinner"
         class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->

    <!-- Sidebar Start -->
    <div class="sidebar pe-4 pb-3">
        <nav class="navbar bg-light navbar-light">
            <a href="/admin/dashboard" class="navbar-brand mx-4 mb-3">
                <h3 class="text-primary">管理员工作台</h3>
            </a>
            <div class="d-flex align-items-center ms-4 mb-4">
                <div class="position-relative">
                    <img class="rounded-circle" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                    <div class="bg-success rounded-circle border border-2 border-white position-absolute end-0 bottom-0 p-1"></div>
                </div>
                <div class="ms-3">
                    <h6 class="mb-0" th:text="${#authentication.principal.username}">用户名</h6>
                    <span>管理员</span><!--此处显示账号类型-->
                </div>
            </div>
            <div class="navbar-nav w-100">
                <a href="/admin/dashboard" class="nav-item nav-link"><i class="fa fa-tachometer-alt me-2"></i>工作台</a>
                <a href="/admin/user-management" class="nav-item nav-link"><i class="fa fa-th me-2"></i>用户管理</a>
                <a href="/admin/role-management" class="nav-item nav-link"><i class="fa fa-keyboard me-2"></i>角色管理</a>
                <a href="/admin/project-management" class="nav-item nav-link active"><i class="fa fa-book me-2"></i>课题管理</a>
                <a href="/admin/message-management" class="nav-item nav-link"><i class="fa fa-envelope me-2"></i>消息管理</a>
            </div>
        </nav>
    </div>
    <!-- Sidebar End -->


    <!-- Content Start -->
    <div class="content">
        <!-- Navbar Start -->
        <nav class="navbar navbar-expand bg-light navbar-light sticky-top px-4 py-0">
            <a href="#" class="sidebar-toggler flex-shrink-0">
                <i class="fa fa-bars"></i>
            </a>
            
            <div class="navbar-nav align-items-center ms-auto">
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                        <img class="rounded-circle me-lg-2" src="/images/user.jpg" alt="" style="width: 40px; height: 40px;">
                        <span class="d-none d-lg-inline-flex" th:text="${#authentication.principal.username}">用户名</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end bg-light border-0 rounded-0 rounded-bottom m-0">
                        <a href="/user/userinfo" class="dropdown-item">个人信息</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item">退出登录</button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Navbar End -->
        <!-- Navbar End -->

        <!-- Project Management Section Start -->
        <div class="container-fluid pt-4 px-4">
            <div class="bg-light text-center rounded p-4">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h4 class="mb-0">课题管理</h4>
                    <button class="btn btn-primary" onclick="location.reload()">
                        <i class="fa fa-refresh"></i> 刷新
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table text-start align-middle table-bordered table-hover mb-0">
                        <thead>
                        <tr class="text-dark">
                            <th scope="col">ID</th>
                            <th scope="col">课题名称</th>
                            <th scope="col">描述</th>
                            <th scope="col">要求</th>
                            <th scope="col">状态</th>
                            <th scope="col">详情</th>
                            <th scope="col">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="topic : ${topics}" th:data-selection-id="${topic.id}">
                            <th scope="row" th:text="${topic.id}">id</th>
                            <td th:text="${topic.title}" style="width: 200px; word-break: break-all;">课题名称</td>
                            <td th:text="${topic.description.length() > 20 ? topic.description.substring(0, 20) + '...' : topic.description}" style="width: 200px; word-break: break-all;">课题描述</td>
                            <td th:text="${topic.requirements.length() > 20 ? topic.requirements.substring(0, 20) + '...' : topic.requirements}" style="width: 200px; word-break: break-all;">要求内容</td>
                            <td>
                                    <span th:classappend="${topic.status == 0} ? 'btn-danger' :
                                                          (${topic.status == 1} ? 'bg-warning' :
                                                          (${topic.status == 2} ? 'btn-success' : 'bg-secondary'))"
                                          class="badge">
                                        <span th:if="${topic.status == 0}">已驳回</span>
                                        <span th:if="${topic.status == 1}">审核中</span>
                                        <span th:if="${topic.status == 2}">进行中</span>
                                        <span th:if="${topic.status == 3}">已完成</span>
                                    </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-primary details-btn">详情</button>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="rejectTopic(this)">驳回</button>
                                <button class="btn btn-sm btn-primary" onclick="confirmTopic(this)">确认</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Project Management Section End -->

        <!-- Footer Start -->
        <div class="container-fluid pt-4 px-4">
            <div class="bg-light rounded-top p-4">
                <div class="row">
                    <div class="col-12 col-sm-6 text-center text-sm-start">
                        &copy; <a href="#">毕业设计学生选题系统</a>, All Right Reserved.
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer End -->
    </div>
    <!-- Content End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
</div>


<!-- Topic Details Modal -->
<div class="modal fade" id="topicDetailsModal" tabindex="-1" aria-labelledby="topicDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="topicDetailsModalLabel">课题详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <h6>课题名称:</h6>
                        <p id="topicDetailsTitle" class="text-muted">N/A</p>
                    </div>
                    <div class="col-md-4">
                        <h6>指导老师:</h6>
                        <p id="topicDetailsTeacher" class="text-muted">N/A</p>
                    </div>
                    <div class="col-md-4">
                        <h6>状态:</h6>
                        <p id="topicDetailsStatus" class="text-muted">N/A</p>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-12">
                        <h6>课题描述:</h6>
                        <p id="topicDetailsDescription" class="text-muted">N/A</p>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-12">
                        <h6>课题要求:</h6>
                        <p id="topicDetailsRequirements" class="text-muted">N/A</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>


<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/lib/chart/chart.min.js"></script>
<script src="/lib/easing/easing.min.js"></script>
<script src="/lib/waypoints/waypoints.min.js"></script>
<script src="/lib/owlcarousel/owl.carousel.min.js"></script>
<script src="/lib/tempusdominus/js/moment.min.js"></script>
<script src="/lib/tempusdominus/js/moment-timezone.min.js"></script>
<script src="/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>
<!-- Template Javascript -->
<script src="/js/main.js"></script>

<script>
function showTopicDetails(topicId) {
    fetch('/admin/getATopicDetails/' + topicId)
        .then(response => {
            if (!response.ok) {
                throw new Error('获取详情失败: ' + response.statusText);
            }
            return response.json();
        })
        .then(data => {
            // 填充模态框内容
            document.getElementById('topicDetailsTitle').innerText = data.title;
            document.getElementById('topicDetailsDescription').innerText = data.description;
            document.getElementById('topicDetailsRequirements').innerText = data.requirements;
            document.getElementById('topicDetailsTeacher').innerText = data.teacherName;
            document.getElementById('topicDetailsStatus').innerText = 
                data.status === 0 ? '已驳回' :
                data.status === 1 ? '审核中' :
                data.status === 2 ? '进行中' : '已完成';
            
            // 显示模态框
            $('#topicDetailsModal').modal('show');
        })
        .catch(error => {
            console.error('Error:', error);
            alert('获取课题详情失败: ' + error.message);
        });
}

// 为详情按钮绑定点击事件
$(document).ready(function() {
    $('.details-btn').click(function() {
        const topicId = $(this).closest('tr').data('selection-id');
        showTopicDetails(topicId);
    });
});
</script>

<script>
function confirmTopic(button) {
    // 获取课题ID
    const topicId = $(button).closest('tr').data('selection-id');
    
    // 发送AJAX请求
    $.ajax({
        url: '/admin/confirmTopic',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ id: topicId }),
        success: function(response) {
            // 成功后重定向当前页面
            window.location.reload();
        },
        error: function(xhr) {
            alert('操作失败: ' + xhr.responseText);
        }
    });
}

function rejectTopic(button) {
    // 获取课题ID
    const topicId = $(button).closest('tr').data('selection-id');
    
    // 发送AJAX请求
    $.ajax({
        url: '/admin/rejectTopic',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ id: topicId }),
        success: function(response) {
            // 成功后重定向当前页面
            window.location.reload();
        },
        error: function(xhr) {
            alert('操作失败: ' + xhr.responseText);
        }
    });
}
</script>
</body>

</html>

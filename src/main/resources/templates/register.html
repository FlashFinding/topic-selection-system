<!DOCTYPE html>
<html lang="zxx">

<head>
    <title>毕业设计学生选题系统*注册</title>
    <!-- Meta tag Keywords -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8" />
    <meta name="keywords"
          content="Report Login Form Responsive web template, Bootstrap Web Templates, Flat Web Templates, Android Compatible web template, Smartphone Compatible web template, free webdesigns for Nokia, Samsung, LG, SonyEricsson, Motorola web design" />
    <!-- //Meta tag Keywords -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!--/Style-CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" type="text/css" media="all" />
    <!--//Style-CSS -->

    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}" type="text/css" media="all">

</head>

<body>

<!-- form section start -->
<section class="w3l-hotair-form">
    <h1>毕业设计学生选题系统</h1>
    <div class="container">
        <!-- /form -->
        <div class="workinghny-form-grid">
            <div class="main-hotair">
                <div class="content-wthree">
                    <h2>注册</h2>
                        <form action="/register" method="post">
                            <label>
                                <input type="text" class="text" name="username" placeholder="用户名" required="">
                                <input type="password" class="password" name="password" placeholder="密码" required="" autofocus>
                            </label>
                            <div class="role-select">
                                <div class="select-wrapper">
                                    <label>
                                        <select name="role" required>
                                            <option value="">选择角色</option>
                                            <option value="STUDENT">学生</option>
                                            <option value="TEACHER">教师</option>
                                            <option value="ADMIN">管理员</option>
                                        </select>
                                    </label>
                                </div>
                            </div>
                            <button class="btn" type="submit">注册</button>
                        </form>

                    <p class="account">已有账户? <a th:href="@{/login}">登录</a></p>
                </div>
                <div class="w3l_form align-self">
                    <div class="left_grid_info">
                        <img th:src="@{/images/index.png}" alt="" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
        <!-- //form -->
    </div>
    <!-- copyright-->
    <div class="copyright text-center">
        <p class="copy-footer-29">© 2025 毕业设计学生选题系统</p>
    </div>
    <!-- //copyright-->
</section>
<!-- //form section start -->
</body>

</html>
